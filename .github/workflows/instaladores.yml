name: Gerar instaladores (Windows e Android)
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_VERSION: 0.3.${{ github.run_number }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Definir versão
        run: npm version ${{ env.APP_VERSION }} --no-git-tag-version --allow-same-version
      - name: Gerar instalador .exe
        run: npm run dist:win
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar o app web e copiar para o Android
        run: npm run build && npx cap sync android
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Usar chave própria (opcional, via segredos do GitHub)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/custom.keystore && echo "KEYSTORE_FILE=custom.keystore" >> $GITHUB_ENV
      - name: Gerar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.APP_VERSION }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk Tinteiro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Tinteiro.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Novidades desta versão
        run: |
          PREV=$(git tag --sort=-creatordate | grep -E '^(v|versao-)' | head -1)
          RANGE=${PREV:+$PREV..HEAD}
          {
            echo "## Novidades"
            git log ${RANGE:--15} --no-merges --pretty='- %s' | grep -v -i -E '^- (merge|wip)' | head -40
            echo
            echo "## Como instalar"
            echo "**Windows:** baixe \`Tinteiro-Setup-${APP_VERSION}.exe\` e execute (se o Windows avisar, clique em Mais informações → Executar assim mesmo). Depois desta versão, o app se atualiza sozinho."
            echo
            echo "**Tablet Android:** baixe \`Tinteiro.apk\` no tablet e abra. O próprio app avisa quando houver versão nova."
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Tinteiro ${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: notes.md
          files: out/*
