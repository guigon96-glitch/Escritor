name: Gerar instaladores (Windows e Android)
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar instalador .exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Usar chave própria (opcional, via segredos do GitHub)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/custom.keystore && echo "KEYSTORE_FILE=custom.keystore" >> $GITHUB_ENV
      - name: Gerar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk Tinteiro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Tinteiro.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Tinteiro — versão ${{ github.run_number }}
          tag_name: versao-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Como instalar
            **Windows:** baixe `Tinteiro-Setup-*.exe` e execute. Se o Windows mostrar “O Windows protegeu o computador”, clique em **Mais informações → Executar assim mesmo** (o app não é assinado por uma empresa).

            **Tablet Android:** baixe `Tinteiro.apk` no tablet e abra. Permita “instalar apps desconhecidos” para o navegador/arquivos quando o Android pedir.
